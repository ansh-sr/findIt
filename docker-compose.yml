services:
  db:
    image: postgres:15-alpine
    container_name: lostfound_db
    restart: always
    environment:
      POSTGRES_DB: lostfound_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./app
    container_name: lostfound_app
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: lostfound_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    volumes:
      - media_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    build: ./nginx
    container_name: lostfound_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - media_data:/var/www/uploads:ro
    depends_on:
      - web
    networks:
      - app_network

  jenkins:
    build: ./jenkins
    container_name: lostfound_jenkins
    restart: always
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_network

volumes:
  pgdata:
  media_data:
  jenkins_data:

networks:
  app_network:
    driver: bridge
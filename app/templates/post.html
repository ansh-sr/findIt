<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post an Item — findIt</title>
    <style>
        :root {
            --bg-cream: #f6f5f0;
            --card-bg: #ffffff;
            --lime: #b5f500;
            --lime-hover: #a3de00;
            --ink: #141414;
            --muted: #6b6b66;
            --border: #e2e0d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        nav {
            background-color: var(--bg-cream);
            border-bottom: 1px solid var(--border);
            padding: 1.1rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--ink);
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.04em;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background-color: var(--lime);
            border-radius: 5px;
            display: grid;
            place-items: center;
        }

        .btn-back {
            background-color: transparent;
            color: var(--ink);
            border: 1.5px solid var(--ink);
            text-decoration: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.6rem 1rem;
            border-radius: 3px;
        }

        .btn-back:hover {
            background-color: var(--ink);
            color: #ffffff;
        }

        .container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .page-head {
            margin-bottom: 1.75rem;
        }

        .page-head span {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .page-head h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-top: 0.25rem;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .field {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
            color: var(--ink);
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #fcfbf9;
            color: var(--ink);
            outline: none;
            transition: border-color 0.15s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--ink);
            background-color: #ffffff;
        }

        .upload-zone {
            border: 1.5px dashed #c8c5ba;
            border-radius: 8px;
            padding: 1.35rem;
            text-align: center;
            background-color: #faf9f5;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .upload-zone:hover {
            border-color: var(--ink);
            background-color: #f3f2ec;
        }

        .upload-zone p {
            font-size: 0.88rem;
            color: var(--muted);
            margin-top: 0.35rem;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        #preview-wrap {
            display: none;
            margin-top: 0.85rem;
        }

        #preview-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .submit-btn {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.9rem 1.25rem;
            background-color: var(--lime);
            color: var(--ink);
            border: 1.5px solid var(--ink);
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.12s ease;
        }

        .submit-btn:hover {
            background-color: var(--lime-hover);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            nav { padding: 1rem 1.5rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">
            <span class="brand-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
                </svg>
            </span>
            findIt
        </a>
        <a href="/" class="btn-back">&larr; BACK TO BOARD</a>
    </nav>

    <div class="container">
        <div class="page-head">
            <span>NEW NOTICE // ENTRY</span>
            <h1>Post an item</h1>
        </div>

        <form class="form-card" method="POST" action="/post" enctype="multipart/form-data">
            <div class="field">
                <label for="category">Status</label>
                <select id="category" name="category">
                    <option value="Lost">Lost — I misplaced this</option>
                    <option value="Found">Found — I picked this up</option>
                </select>
            </div>

            <div class="field">
                <label for="title">Item Name</label>
                <input type="text" id="title" name="title" placeholder="e.g., Brown Leather Wallet, Car Keys, iPhone 14 Pro" required>
            </div>

            <div class="field">
                <label for="location">Where on Campus?</label>
                <input type="text" id="location" name="location" placeholder="e.g., Main Canteen, Library 2nd Floor, Lab 3" required>
            </div>

            <div class="field">
                <label for="contact">Contact Details</label>
                <input type="text" id="contact" name="contact" placeholder="Phone number, room no., or college email" required>
            </div>

            <div class="field">
                <label>Photo (Optional)</label>
                <label class="upload-zone" for="image">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p id="file-label">Click to attach an image (JPG, PNG, WEBP up to 10MB)</p>
                    <input type="file" id="image" name="image" accept="image/*" onchange="previewFile(event)">
                </label>
                <div id="preview-wrap">
                    <img id="preview-img" alt="Upload preview">
                </div>
            </div>

            <button type="submit" class="submit-btn">Publish to findIt &rarr;</button>
        </form>
    </div>

    <script>
        function previewFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById("file-label").textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("preview-img").src = e.target.result;
                document.getElementById("preview-wrap").style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
